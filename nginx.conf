# Esconde a versão do nginx nas respostas e nas páginas de erro.
server_tokens off;

# O mesmo site em www e sem www são duas páginas iguais em endereços
# diferentes, e os motores de busca tratam-nas como conteúdo duplicado. O
# endereço sem www é o canónico — é o que o sitemap e o canonical anunciam.
server {
  listen 80;
  server_name ~^www\.(?<canonico>.+)$;
  return 301 https://$canonico$request_uri;
}

server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  index index.html;

  # O site é sempre servido por HTTPS pelo proxy do Coolify. Sem
  # includeSubDomains: o cliente pode ter subdomínios (webmail, por exemplo)
  # que não controlamos.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # O build usa trailingSlash, portanto /privacidade/ é uma pasta com index.html.
  # O =404 devolve mesmo 404: com /404.html a página de erro saía com estado
  # 200, e um endereço inventado entrava no Google como página a sério.
  error_page 404 /404.html;
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Fotografias e logótipo não mudam de nome. Sem isto saíam com quatro horas de
  # validade e cada visita voltava a descarregá-los.
  location ~* ^/(fotos|logos|avatars)/ {
    add_header Cache-Control "public, max-age=2592000" always;
    # O site é sempre servido por HTTPS pelo proxy do Coolify. Sem
    # includeSubDomains: o cliente pode ter subdomínios (webmail, por exemplo)
    # que não controlamos.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # O Next exporta o cartão de partilha sem extensão. Sem esta linha sai como
  # application/octet-stream e o WhatsApp não mostra imagem nenhuma.
  # Não leva add_header, portanto herda os cabeçalhos de cima.
  location = /opengraph-image {
    default_type image/png;
    expires 7d;
  }

  # Tudo em /_next/ tem hash no nome e nunca muda. Sem `expires`: somava um
  # segundo Cache-Control ao de baixo, e saíam dois cabeçalhos iguais.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # O site é sempre servido por HTTPS pelo proxy do Coolify. Sem
    # includeSubDomains: o cliente pode ter subdomínios (webmail, por exemplo)
    # que não controlamos.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
